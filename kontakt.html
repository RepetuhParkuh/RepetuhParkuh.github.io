
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3DJIMO | Kontakt</title>

    <link rel="apple-touch-icon" sizes="180x180" href="src/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="src/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="src/icons/favicon-16x16.png">
    <link rel="manifest" href="src/site.webmanifest">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/kontakt.css">
</head>

<body>

    <div class="contact-page">

        <!-- NAVIGACE -->
        <header class="site-header">
            <div class="nav-div">

                <a href="index.html" class="site-logo" aria-label="3DJIMO – Domů">
                    <img src="src/logo_3DJimo.png" alt="3DJIMO">
                </a>

                <nav aria-label="Hlavní navigace">
                    <a href="index.html">Domů</a>
                    <a href="about.html">O nás</a>
                    <a href="reseni.html">Řešení</a>

                    <a href="kontakt.html" class="nav-button nav-active">
                        KONTAKT <span>→</span>
                    </a>
                </nav>

            </div>
        </header>

        <!-- KONTAKTNÍ SEKCE -->
        <main class="contact-main">

            <section class="contact-section">

                <!-- LEVÁ ČÁST -->
                <div class="contact-content">

                    <h1>
                        Pojďme pro Vás společně
                        vytvořit řešení
                    </h1>

                    <p>
                        Máte otázku, nápad nebo konkrétní potřebu?
                        Ozvěte se nám. Rádi s Vámi probereme možnosti
                        spolupráce a najdeme nejlepší cestu k řešení.
                    </p>

                </div>

                <!-- PRAVÁ ČÁST – FORMULÁŘ -->
                <div class="contact-form-card">

                    <h2>Napište nám</h2>

                    <form class="contact-form">

                        <input
                            type="text"
                            name="name"
                            placeholder="Jméno a příjmení"
                            autocomplete="name"
                            required
                        >

                        <input
                            type="email"
                            name="email"
                            placeholder="E-mail"
                            autocomplete="email"
                            required
                        >

                        <input
                            type="tel"
                            name="phone"
                            placeholder="Telefonní číslo"
                            autocomplete="tel"
                        >

                        <textarea
                            name="message"
                            placeholder="Vaše zpráva"
                            required
                        ></textarea>

                        <button type="submit">
                            ODESLAT ZPRÁVU
                            <span>→</span>
                        </button>

                    </form>

                </div>

            </section>

        </main>

    </div>

</body>
</html>
